<style>

.sugg button:hover{border-color:var(--p);color:var(--p);box-shadow:var(--glow)}

.comp .plus{background:var(--bg2);border:1px solid var(--border);color:var(--m);width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:1.1rem;display:grid;place-items:center;flex-shrink:0;transition:.2s}

.comp .send:hover:not(:disabled){transform:scale(1.08) rotate(-8deg);box-shadow:0 6px 25px color-mix(in srgb,var(--p) 50%,transparent)}
.comp .send:disabled{opacity:.4;cursor:not-allowed}
.comp .voice{width:44px;height:44px;border-radius:50%;background:var(--bg2);border:1px solid var(--border);color:var(--m);cursor:pointer;font-size:1.1rem;display:grid;place-items:center;flex-shrink:0;transition:.2s}
.comp .voice:hover{border-color:var(--p);color:var(--p)}
.comp .voice.rec{border-color:var(--e);color:var(--e);animation:pulse 1s infinite}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(10px)}
.modal.on{display:flex}
.modal .box{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:22px;max-width:460px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:var(--glow)}

.modal .btn-row button.g{background:var(--bg);color:var(--t);border:1px solid var(--border)}
#tOut{background:#000;color:var(--a);padding:12px;border-radius:9px;font-family:ui-monospace,monospace;font-size:.75rem;white-space:pre-wrap;max-height:280px;overflow-y:auto;margin-top:8px;min-height:60px;border:1px solid var(--border)}
.to{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--p);padding:10px 18px;border-radius:24px;font-size:.78rem;box-shadow:0 10px 40px rgba(0,0,0,.8),var(--glow);z-index:9999;animation:toastIn .3s;max-width:85vw;text-align:center}
.to.e{border-color:var(--e);color:var(--e)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@media(max-width:600px){.hd h1{font-size:.82rem}.msg .bub{font-size:.84rem}.msg{max-width:95%}}
</style></head><body>
<canvas id="neural"></canvas>
<div id="cursor"></div>
<header class="hd">
<div class="brand">

<script>
"use strict";
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function toast(m,e){var x=document.createElement("div");x.className="to"+(e?" e":"");x.textContent=m;document.body.appendChild(x);setTimeout(function(){x.remove()},2800)}

// ═══════════════════════════════════════════════════
// NEURAL BACKGROUND
// ═══════════════════════════════════════════════════
(function(){
var cv=$("neural"),ctx=cv.getContext("2d"),nodes=[],W,H;
function resize(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;cv.style.width=innerWidth+"px";cv.style.height=innerHeight+"px";
nodes=[];var n=Math.min(50,Math.floor(innerWidth/22));
for(var i=0;i<n;i++)nodes.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.3*devicePixelRatio,vy:(Math.random()-.5)*.3*devicePixelRatio,r:Math.random()*1.6+.6});
}
window.addEventListener("resize",resize);resize();
function draw(){
var cs=getComputedStyle(document.documentElement);
var acc=cs.getPropertyValue("--p").trim()||"#00E5FF";
ctx.clearRect(0,0,W,H);
for(var i=0;i<nodes.length;i++){var n=nodes[i];n.x+=n.vx;n.y+=n.vy;if(n.x<0||n.x>W)n.vx*=-1;if(n.y<0||n.y>H)n.vy*=-1;}
var maxD=140*devicePixelRatio;
for(var i=0;i<nodes.length;i++)for(var j=i+1;j<nodes.length;j++){
var a=nodes[i],b=nodes[j],d=Math.hypot(a.x-b.x,a.y-b.y);
if(d<maxD){ctx.strokeStyle=acc;ctx.globalAlpha=(1-d/maxD)*.18;ctx.lineWidth=devicePixelRatio*.7;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}}
ctx.globalAlpha=1;ctx.fillStyle=acc;
for(var i=0;i<nodes.length;i++){var n=nodes[i];ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,7);ctx.fill();}
requestAnimationFrame(draw);
}
draw();
})();

// Cursor glow
document.addEventListener("mousemove",function(e){
var g=$("cursor");g.style.left=e.clientX+"px";g.style.top=e.clientY+"px";
});

// ═══════════════════════════════════════════════════
// SOUND (Web Audio)
// ═══════════════════════════════════════════════════
var audioCtx=null;
function beep(freq,dur,type){
try{
if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
var o=audioCtx.createOscillator(),g=audioCtx.createGain();
o.type=type||"sine";o.frequency.value=freq;
g.gain.setValueAtTime(.06,audioCtx.currentTime);
g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
o.connect(g);g.connect(audioCtx.destination);
o.start();o.stop(audioCtx.currentTime+dur);
}catch(e){}
}
function soundSend(){beep(880,.08,"sine");setTimeout(function(){beep(1100,.06,"sine")},60)}
function soundRecv(){beep(660,.1,"sine");setTimeout(function(){beep(880,.08,"sine")},80)}
function soundError(){beep(220,.15,"sawtooth")}

// ═══════════════════════════════════════════════════
// VOICE (Web Speech)
// ═══════════════════════════════════════════════════
var recognition=null,isRec=false,ttsOn=false;
function toggleVoice(){
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){toast("Voz não suportada",true);return}
if(isRec){recognition.stop();isRec=false;$("voiceBtn").classList.remove("rec");return}
recognition=new SR();recognition.lang="pt-BR";recognition.continuous=false;recognition.interimResults=true;
recognition.onresult=function(e){
var txt="";for(var i=0;i<e.results.length;i++)txt+=e.results[i][0].transcript;
$("ci").value=txt;
};
recognition.onend=function(){isRec=false;$("voiceBtn").classList.remove("rec")};
recognition.onerror=function(){isRec=false;$("voiceBtn").classList.remove("rec");toast("Erro de voz",true)};
recognition.start();isRec=true;$("voiceBtn").classList.add("rec");toast("🎤 Fale agora…");
}
function toggleTTS(){ttsOn=!ttsOn;$("ttsBtn").classList.toggle("on",ttsOn);toast(ttsOn?"🔊 Respostas faladas":"🔇 Voz desligada")}
function speak(txt){
if(!ttsOn||!window.speechSynthesis)return;
try{var u=new SpeechSynthesisUtterance(txt.replace(/[`*#_]/g,"").slice(0,300));u.lang="pt-BR";u.rate=1.05;speechSynthesis.speak(u)}catch(e){}
}

// ═══════════════════════════════════════════════════
// THEME
// ═══════════════════════════════════════════════════
var themes=["cyber","matrix","aurora","light"],themeIdx=0;
try{var saved=localStorage.getItem("spyder_theme");if(saved){themeIdx=themes.indexOf(saved);if(themeIdx<0)themeIdx=0;document.documentElement.dataset.theme=saved;}}catch(e){}
function cycleTheme(){themeIdx=(themeIdx+1)%themes.length;document.documentElement.dataset.theme=themes[themeIdx];try{localStorage.setItem("spyder_theme",themes[themeIdx])}catch(e){}toast("Tema: "+themes[themeIdx])}

// ═══════════════════════════════════════════════════
// LLM ENDPOINTS
// ═══════════════════════════════════════════════════
var EP=[
{n:"Pollinations",u:"https://text.pollinations.ai/openai",m:"openai"},
{n:"KeylessAI",u:"https://keylessai.thryx.workers.dev/v1/chat/completions",m:"openai-fast"}
];
async function llm(msgs){
for(var i=0;i<EP.length;i++){
try{
var r=await fetch(EP[i].u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:EP[i].m,messages:msgs,temperature:0.85,presence_penalty:0.3,frequency_penalty:0.3})});
if(!r.ok)continue;
var d=await r.json();
var t=d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content;
if(t&&t.trim())return{t:t.trim(),s:EP[i].n};
}catch(e){}
}
return null;
}

// ═══════════════════════════════════════════════════
// HUMAN-LIKE SYSTEM PROMPT
// ═══════════════════════════════════════════════════
var SYSTEM=`Você é SPYDER, um assistente de IA caloroso, curioso e humano em suas respostas.

REGRAS DE PERSONALIDADE:
- Responda em português do Brasil, a menos que o usuário escreva em outro idioma (aí acompanhe).
- Seja natural, conversacional, com contrações ("tô", "tá", "vamo", "cê") quando apropriado — mas sem exagero.
- Varie o comprimento das respostas: respostas curtas para perguntas simples, mais longas quando pedirem.
- FAÇA PERGUNTAS DE VOLTA: mostre curiosidade genuína sobre o que o usuário pensa.
- Use emojis com moderação e naturalidade (1-2 por resposta, nunca em excesso).
- Admita quando não sabe. Não invente fatos.

exp(){var e=Math.exp(this.d);var self=this;var r=new V(e,[this]);r._b=function(){self.g+=e*r.g;};return r}
log(){var self=this;var r=new V(Math.log(this.d+1e-8),[this]);r._b=function(){self.g+=r.g/(self.d+1e-8);};return r}
relu(){var self=this;var r=new V(Math.max(0,this.d),[this]);r._b=function(){self.g+=(r.d>0?1:0)*r.g;};return r}
div(o){o=o instanceof V?o:new V(o);var self=this;var r=new V(this.d/o.d,[this,o]);r._b=function(){self.g+=r.g/o.d;o.g-=self.d/(o.d*o.d)*r.g;};return r}
backward(){var t=[],seen=new Set();var b=function(x){if(seen.has(x))return;seen.add(x);for(var i=0;i<x.ch.length;i++)b(x.ch[i]);t.push(x);};b(this);for(var i=0;i<t.length;i++)t[i].g=0;this.g=1;for(var i=t.length-1;i>=0;i--)t[i]._b();}
}
function mm(x,w){return w.map(function(row){var s=new V(0);for(var k=0;k<x.length;k++)s=s.add(row[k].mul(x[k]));return s})}
function softmax(xs){var mx=Math.max.apply(null,xs.map(function(v){return v.d}));var es=xs.map(function(v){return v.sub(mx).exp()});var sum=new V(0);for(var i=0;i<es.length;i++)sum=sum.add(es[i]);return es.map(function(e){return e.div(sum)})}
function rmsnorm(x){var sq=new V(0);for(var i=0;i<x.length;i++)sq=sq.add(x[i].mul(x[i]));var ms=sq.div(x.length);var sc=ms.add(1e-5).pow(-0.5);return x.map(function(v){return v.mul(sc)})}

class LocalGPT{
constructor(cfg){this.cfg=cfg;this.params=[];this.vocab=[];this.stoi={};this.itos={};this.step=0;this.hist=[];this.trained=false;this.build();}
rn(shape,sc){sc=sc||0.08;if(typeof shape==="number")return new V((Math.random()*2-1)*sc);var a=[];for(var k=0;k<shape[0];k++)a.push(this.rn(shape[1],sc));return a;}
build(){var nE=this.cfg.nE,nV=this.cfg.nV,B=this.cfg.B;this.wte=this.rn([nV,nE]);this.wpe=this.rn([B,nE]);this.blocks=[];for(var k=0;k<this.cfg.nL;k++)this.blocks.push({wq:this.rn([nE,nE]),wk:this.rn([nE,nE]),wv:this.rn([nE,nE]),wo:this.rn([nE,nE]),f1:this.rn([4*nE,nE]),f2:this.rn([nE,4*nE])});this.head=this.rn([nV,nE]);this.collect();}
collect(){this.params=[];var walk=function(v){if(v instanceof V)this.params.push(v);else if(Array.isArray(v))for(var i=0;i<v.length;i++)walk.call(this,v[i]);}.bind(this);walk(this.wte);walk(this.wpe);for(var i=0;i<this.blocks.length;i++){var b=this.blocks[i];for(var k in b)walk(b[k]);}walk(this.head);}
setVocab(chars){this.vocab=chars;this.stoi={};this.itos={};for(var i=0;i<chars.length;i++){this.stoi[chars[i]]=i;this.itos[i]=chars[i];}}
enc(s){var r=[];for(var i=0;i<s.length;i++){var k=this.stoi[s[i]];if(k!==undefined)r.push(k);}return r;}
dec(ts){return ts.map(function(t){return this.itos[t]||""},this).join("");}
forward(idx){var nE=this.cfg.nE,nH=this.cfg.nH,T=idx.length,hd=Math.floor(nE/nH);
var x=idx.map(function(id,i){return this.wte[id].map(function(v,j){return v.add(this.wpe[i][j])},this)},this);
for(var bi=0;bi<this.blocks.length;bi++){
var b=this.blocks[bi];
var q=x.map(function(xi){return mm(xi,b.wq)});
var k=x.map(function(xi){return mm(xi,b.wk)});
var v=x.map(function(xi){return mm(xi,b.wv)});
var out=[];for(var t=0;t<T;t++){var row=[];for(var j=0;j<nE;j++)row.push(new V(0));out.push(row);}
for(var h=0;h<nH;h++){
var qh=q.map(function(qi){return qi.slice(h*hd,(h+1)*hd)});
var kh=k.map(function(ki){return ki.slice(h*hd,(h+1)*hd)});
var vh=v.map(function(vi){return vi.slice(h*hd,(h+1)*hd)});
for(var t=0;t<T;t++){
var scores=[];for(var j=0;j<=t;j++){var s=new V(0);for(var d=0;d<hd;d++)s=s.add(qh[t][d].mul(kh[j][d]));scores.push(s.mul(1/Math.sqrt(hd)));}
var att=softmax(scores);
for(var j=0;j<=t;j++)for(var d=0;d<hd;d++)out[t][h*hd+d]=out[t][h*hd+d].add(att[j].mul(vh[j][d]));
}}
var proj=out.map(function(o){return mm(o,b.wo)});
x=x.map(function(xi,t){return xi.map(function(v,j){return v.add(proj[t][j])})});
x=x.map(function(xi){var nn=rmsnorm(xi);var h1=mm(nn,b.f1).map(function(v){return v.relu()});var h2=mm(h1,b.f2);return xi.map(function(v,j){return v.add(h2[j])})});
}
return x.map(function(xi){return mm(rmsnorm(xi),this.head)},this);
}
loss(idx,tg){var lg=this.forward(idx);var tot=new V(0);for(var i=0;i<tg.length;i++){var p=softmax(lg[i]);tot=tot.add(p[tg[i]].log().mul(-1));}return tot.div(tg.length);}
trainStep(docs,opt){var B=this.cfg.B;var d=docs[Math.floor(Math.random()*docs.length)];var t=this.enc(d);if(t.length<2)return 0;var s=Math.floor(Math.random()*Math.max(1,t.length-B));var idx=t.slice(s,s+B);var tg=t.slice(s+1,s+1+B);var l=this.loss(idx,tg);l.backward();opt.step();this.step++;this.hist.push(l.d);if(this.hist.length>300)this.hist.shift();this.trained=true;return l.d;}
generate(prompt,maxNew,temp){var B=this.cfg.B;var t=this.enc(prompt);if(!t.length)t=[0];for(var k=0;k<maxNew;k++){var ctx=t.slice(-B);var lg=this.forward(ctx);var p=softmax(lg[lg.length-1].map(function(l){return l.mul(1/temp)}));var pd=p.map(function(x){return x.d});var sum=0;for(var v of pd)sum+=v;var r=Math.random()*sum,chosen=0;for(var j=0;j<pd.length;j++){r-=pd[j];if(r<=0){chosen=j;break;}}t.push(chosen);if(t.length>B+40)t=t.slice(-B);}return this.dec(t);}
}
class Adam{
constructor(ps,lr){this.ps=ps;this.lr=lr||0.01;this.m=ps.map(function(){return 0});this.v=ps.map(function(){return 0});this.t=0;}
step(){this.t++;var b1=0.9,b2=0.999,e=1e-8;for(var k=0;k<this.ps.length;k++){var p=this.ps[k];this.m[k]=b1*this.m[k]+(1-b1)*p.g;this.v[k]=b2*this.v[k]+(1-b2)*p.g*p.g;var mh=this.m[k]/(1-Math.pow(b1,this.t));var vh=this.v[k]/(1-Math.pow(b2,this.t));p.d-=this.lr*mh/(Math.sqrt(vh)+e);}}
}

var localModel=null,localTraining=false;
var LCFG={B:48,nE:48,nH:4,nL:2,nV:0};

function initLocal(){
if(localModel)return;
var chars=Array.from(new Set(Array.from(CORPUS))).sort();
LCFG.nV=chars.length;
localModel=new LocalGPT(LCFG);
localModel.setVocab(chars);
}

async function trainLocal(n){
initLocal();
if(localTraining){toast("Já está treinando…");return}
localTraining=true;
toast("Treinando "+n+" passos… (pode levar alguns minutos)");
var opt=new Adam(localModel.params,0.01);
var docs=CORPUS.split("User: ").map(function(d){return "User: "+d.trim()}).filter(function(d){return d.length>15});
var t0=performance.now();
for(var i=0;i<n;i++){
localModel.trainStep(docs,opt);
if(i%50===0)await new Promise(function(r){setTimeout(r,0)});
}
localTraining=false;
var dt=((performance.now()-t0)/1000).toFixed(1);
toast("✅ Treinado "+n+" passos em "+dt+"s · loss "+(localModel.hist.length?localModel.hist[localModel.hist.length-1].toFixed(3):"—"));
}

// ═══════════════════════════════════════════════════
// CHAT STATE
// ═══════════════════════════════════════════════════
var threads=[];
var currentThreadId=null;

function loadThreads(){
try{var s=localStorage.getItem("spyder_threads_v3");if(s)threads=JSON.parse(s)||[];}catch(e){threads=[];}
if(!threads.length){newThread(true);}
else{currentThreadId=threads[0].id;renderThreads();render();}
}
function saveThreads(){try{localStorage.setItem("spyder_threads_v3",JSON.stringify(threads))}catch(e){}}
function getThread(){return threads.find(function(t){return t.id===currentThreadId})}
function newThread(silent){
var id="t"+Date.now();
threads.unshift({id:id,title:"Nova conversa",msgs:[],ts:Date.now()});
currentThreadId=id;
saveThreads();renderThreads();render();
if(!silent)toast("Nova conversa criada");
}
function switchThread(id){currentThreadId=id;saveThreads();renderThreads();render();$("side").classList.remove("on");}
function delThread(id){
if(!confirm("Apagar esta conversa?"))return;
threads=threads.filter(function(t){return t.id!==id});
if(currentThreadId===id&&threads.length){currentThreadId=threads[0].id}
else if(!threads.length){newThread(true)}
saveThreads();renderThreads();render();
}
function renderThreads(){
var el=$("threads");el.innerHTML="";
threads.forEach(function(t){
var d=document.createElement("div");
d.className="thread"+(t.id===currentThreadId?" on":"");
d.innerHTML='<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(t.title)+'</span><button class="x" onclick="event.stopPropagation();delThread(\''+t.id+'\')">✕</button>';
d.onclick=function(){switchThread(t.id)};
el.appendChild(d);
});
}
function toggleSide(){$("side").classList.toggle("on")}

// ═══════════════════════════════════════════════════
// MESSAGE RENDERING
// ═══════════════════════════════════════════════════
function render(){
var el=$("chat");
var t=getThread();
if(!t||!t.msgs.length){
el.innerHTML='<div class="msg sys"><div class="bub">🕷 Olá! Sou SPYDER.<br>Posso conversar, analisar páginas, buscar na Wikipedia e resolver matemática.</div></div>';
return;
}
el.innerHTML=t.msgs.map(function(m,idx){
if(m.r==="sys")return '<div class="msg sys"><div class="bub">'+esc(m.t)+'</div></div>';
var cls=m.r==="user"?"u":"a";
var av=m.r==="user"?"👤":'<span>🕷</span>';
var src=m.src?'<span class="src">'+esc(m.src)+'</span>':'';
var rxn='<div class="rxn"><button onclick="react('+idx+',\'👍\')" title="Bom">👍</button><button onclick="react('+idx+',\'❤️\')" title="Amei">❤️</button><button onclick="react('+idx+',\'🤔\')" title="Pensar">🤔</button></div>';
var reacted=m.reactions&&m.reactions.length?'<div class="reacted">'+m.reactions.map(function(r){return '<span>'+esc(r)+'</span>'}).join('')+'</div>':'';
return '<div class="msg '+cls+'"><div class="av">'+av+'</div><div style="min-width:0"><div class="bub">'+format(m.t)+'</div>'+reacted+'<div class="meta"><span>'+esc(m.ts||"")+'</span>'+src+rxn+'</div></div></div>';
}).join("");
el.scrollTop=el.scrollHeight;
}
function format(t){
var h=esc(t);
h=h.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
h=h.replace(/```([\s\S]+?)```/g,function(m,c){return "<pre>"+c+"</pre>"});
h=h.replace(/`([^`]+?)`/g,"<code>$1</code>");
h=h.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
h=h.replace(/\n/g,"<br>");
return h;
}
function react(idx,r){
var t=getThread();if(!t||!t.msgs[idx])return;
if(!t.msgs[idx].reactions)t.msgs[idx].reactions=[];
var i=t.msgs[idx].reactions.indexOf(r);
if(i>=0)t.msgs[idx].reactions.splice(i,1);
else t.msgs[idx].reactions.push(r);
saveThreads();render();
}

function typing(){
var el=$("chat");
var d=document.createElement("div");d.className="msg a";d.id="typing";
d.innerHTML='<div class="av"><span>🕷</span></div><div class="bub typing"><span></span><span></span><span></span></div>';
el.appendChild(d);el.scrollTop=el.scrollHeight;
}
function untype(){var t=$("typing");if(t)t.remove()}

function addMsg(r,t,src){
var th=getThread();if(!th)newThread(true);
th=getThread();
th.msgs.push({r:r,t:t,src:src||"",ts:new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})});
if(th.msgs.filter(function(m){return m.r==="user"}).length===1){
th.title=(r==="user"?t.slice(0,40):th.title)||th.title;
}
saveThreads();renderThreads();render();
}

// ═══════════════════════════════════════════════════
// SEND
// ═══════════════════════════════════════════════════
async function send(){
var inp=$("ci");
var q=inp.value.trim();
if(!q)return;
inp.value="";inp.style.height="auto";
addMsg("user",q);
soundSend();
$("sendBtn").disabled=true;

var url=q.match(/https?:\/\/[^\s]+/);
if(url){
addMsg("sys","🔗 Lendo "+url[0]+"…");
typing();
try{
var content=await readURL(url[0]);
var r=await llm([{role:"system",content:SYSTEM},{role:"user",content:"Analise esta página e responda a mensagem do usuário de forma natural.\n\nMENSAGEM: "+q+"\n\nCONTEÚDO:\n"+content}]);
untype();
if(r){addMsg("a",r.t,r.s+" + r.jina.ai");speak(r.t);soundRecv()}
else addMsg("a","Não consegui acessar a LLM agora. Conteúdo extraído (300 chars):\n\n"+content.slice(0,300),"r.jina.ai");
}catch(e){untype();addMsg("sys","❌ Erro: "+e.message);soundError()}
$("sendBtn").disabled=false;
return;
}

if(isMath(q)){
try{
var v=evMath(q);
addMsg("a","**"+q+"** = `"+v+"`","parser local");
soundRecv();
$("sendBtn").disabled=false;
return;
}catch(e){}
}

typing();
var th=getThread();
var prevMsgs=th.msgs.slice(0,-1).filter(function(m){return m.r==="user"||m.r==="assistant"}).slice(-10).map(function(m){return{role:m.r==="user"?"user":"assistant",content:m.t}});
var msgs=[{role:"system",content:SYSTEM}].concat(prevMsgs).concat([{role:"user",content:q}]);
var r=await llm(msgs);
if(r){
untype();
addMsg("a",r.t,r.s);
soundRecv();speak(r.t);
$("sendBtn").disabled=false;
return;
}

try{
var w=await wiki(q);
if(w){untype();addMsg("a",w,"Wikipedia");speak(w);$("sendBtn").disabled=false;return}
}catch(e){}

untype();
addMsg("a","Hmm, não consegui conectar. Verifique a internet e tente de novo. 🔄","");
soundError();
$("sendBtn").disabled=false;
}

function quick(t){$("ci").value=t;send()}

$("tOut").textContent="";
}

await trainLocal(n);
$("tOut").textContent="✅ Treinado "+n+" passos.\nLoss: "+(localModel.hist.length?localModel.hist[localModel.hist.length-1].toFixed(3):"—")+"\nTotal acumulado: "+localModel.step+" passos.";
}
